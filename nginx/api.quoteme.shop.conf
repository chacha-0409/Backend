# ──────────────────────────────────────────────────────────────
# /etc/nginx/sites-available/api.quoteme.shop.conf
# 심볼릭 링크: sudo ln -s /etc/nginx/sites-available/api.quoteme.shop.conf /etc/nginx/sites-enabled/
# ──────────────────────────────────────────────────────────────

# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    server_name api.quoteme.shop;

    # Certbot ACME 챌린지 (인증서 발급/갱신 시 필요)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Spring Boot 리버스 프록시
server {
    listen 443 ssl;
    server_name api.quoteme.shop;

    # ── SSL 인증서 (Certbot 발급 후 경로 자동 설정됨) ──────────
    ssl_certificate     /etc/letsencrypt/live/api.quoteme.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.quoteme.shop/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── 보안 헤더 ────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "DENY"                                always;

    # ── 업로드 크기 제한 (프로필 이미지 S3 업로드 고려) ─────────
    client_max_body_size 10M;

    # ── Spring Boot 앱으로 프록시 ────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8070;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 일반 REST API 타임아웃
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }
}
