services:
  app:
    image: ${DOCKERHUB_USERNAME}/quoteme:latest
    restart: unless-stopped
    ports:
      - "8070:8070"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8070/ || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
